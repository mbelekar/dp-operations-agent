name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11"

      - name: Install dependencies
        run: ./auto/build

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy

      - name: Run offline test suite with coverage
        run: ./auto/test --cov

      - name: Audit runtime dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/runtime-requirements.txt"
          .venv/bin/pip-audit --strict --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/runtime-requirements.txt"
