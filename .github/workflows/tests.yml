name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # setup-uv publishes no floating major tag (no @v10), so pin the commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.16"

      - name: Install dependencies
        run: ./auto/build

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy

      - name: Run offline test suite with coverage
        run: ./auto/test --cov

      - name: Audit runtime dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/runtime-requirements.txt"
          .venv/bin/pip-audit --strict --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/runtime-requirements.txt"
