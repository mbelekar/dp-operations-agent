<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Platform Operations Agent · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Data Platform Operations Agent</h1>

    <svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dp-agent-architecture-title dp-agent-architecture-desc">
      <title id="dp-agent-architecture-title">Data Platform Operations Agent architecture</title>
      <desc id="dp-agent-architecture-desc">An incident alert enters a LangGraph orchestrator loop, which calls Kafka and Flink diagnostic tools through a Live or Fixture gateway and collects typed Signal evidence. A grounding gate accepts a diagnosis only when every cited signal was actually collected that session, otherwise it rejects and the loop continues.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (drawn before nodes) ===== -->

      <!-- Alert -> Orchestrator -->
      <line x1="152" y1="272" x2="192" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Orchestrator -> Tools -->
      <line x1="336" y1="272" x2="376" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Tools -> Signal -->
      <line x1="520" y1="272" x2="560" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="524" y="252" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMITS</text>

      <!-- Signal -> Grounding gate -->
      <line x1="672" y1="272" x2="712" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="676" y="252" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="692" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CITES</text>

      <!-- Grounding gate -> Diagnosis (primary / accent) -->
      <line x1="872" y1="272" x2="912" y2="272" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="878" y="252" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="892" y="261" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>

      <!-- Reject / loop-back: Grounding gate -> Orchestrator (dashed, routed above the row) -->
      <path d="M 792,240 V 196 Q 792,188 784,188 H 272 Q 264,188 264,196 V 240"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="504" y="168" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECT</text>

      <!-- Tools -> Gateway (call) -->
      <line x1="432" y1="304" x2="432" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gateway -> Tools (return, dashed) -->
      <line x1="464" y1="400" x2="464" y2="304" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->

      <!-- Incident alert (Input) -->
      <rect x="40" y="240" width="112" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="240" width="112" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="248" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="60" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="96" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Incident alert</text>
      <text x="96" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert_text</text>

      <!-- Orchestrator (Backend) -->
      <rect x="192" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="192" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="200" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="216" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="264" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
      <text x="264" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">create_agent loop</text>

      <!-- Diagnostic tools (Backend) -->
      <rect x="376" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="384" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="400" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
      <text x="448" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diagnostic tools</text>
      <text x="448" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kafka + Flink</text>

      <!-- Signal (Store) -->
      <rect x="560" y="240" width="112" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="240" width="112" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="568" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="584" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="616" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signal</text>
      <text x="616" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typed evidence</text>

      <!-- Grounding gate (Focal) -->
      <rect x="712" y="240" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="240" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="720" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="736" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="792" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grounding gate</text>
      <text x="792" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">submit_diagnosis</text>

      <!-- Diagnosis (Store, terminal) -->
      <rect x="912" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="912" y="240" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="920" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="934" y="257" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="984" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diagnosis</text>
      <text x="984" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ audit log</text>

      <!-- Gateway (Store) -->
      <rect x="376" y="400" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="400" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="384" y="408" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="396" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">I/O</text>
      <text x="448" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway</text>
      <text x="448" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Live / Fixture</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="520" x2="1080" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Grounding gate</text>

      <rect x="210" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="230" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Orchestrator / tools</text>

      <rect x="400" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="420" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data / evidence</text>

      <rect x="580" y="552" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="600" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Incident input</text>

      <line x1="740" y1="557" x2="768" y2="557" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="776" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Grounded</text>

      <line x1="880" y1="557" x2="908" y2="557" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="916" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Rejected / return</text>
    </svg>
  </div>
</body>
</html>
