<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dbt failure triage: model logic or upstream inputs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 560px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · dbt triage</p>
    <h1>Is it the model, or its inputs?</h1>

    <svg viewBox="0 0 520 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dbt-triage-title dbt-triage-desc">
      <title id="dbt-triage-title">dbt failure triage: model logic or upstream inputs</title>
      <desc id="dbt-triage-desc">When a dbt test or model fails, the agent checks whether it passed on the previous run and whether the model code changed: changed code means investigating dbt, unchanged code means investigating the upstream inputs.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first, so boxes sit on top. -->
      <!-- Centre column: endpoints share x=260, straight lines. -->
      <line x1="260" y1="80" x2="260" y2="119" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="176" x2="260" y2="215" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- The split: two connectors leave the decision's bottom edge (80..440)
           at their own attach points, L*k/(N+1) = 200 and 320, then elbow (r=8)
           to each branch box's centre. -->
      <path d="M200 272 V284 A8 8 0 0 1 192 292 H148 A8 8 0 0 0 140 300 V311"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M320 272 V284 A8 8 0 0 0 328 292 H372 A8 8 0 0 1 380 300 V311"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Each branch to its outcome: straight lines. -->
      <line x1="140" y1="368" x2="140" y2="407" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="380" y1="368" x2="380" y2="407" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 1 -->
      <rect x="80" y="24" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="24" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dbt test or model fails</text>

      <!-- 2 -->
      <rect x="80" y="120" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="120" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Did it pass on the previous run?</text>

      <!-- 3 -->
      <rect x="80" y="216" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="216" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Did the model code change?</text>

      <!-- Branch answers: lighter treatment, so they read as answers, not steps. -->
      <rect x="40" y="312" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="312" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Code changed</text>

      <rect x="280" y="312" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="312" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="380" y="344" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Code unchanged</text>

      <!-- Outcomes -->
      <rect x="40" y="408" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="408" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Investigate dbt</text>

      <!-- Focal: the non-obvious conclusion -->
      <rect x="280" y="408" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="408" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="380" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Investigate upstream inputs</text>
    </svg>
  </div>
</body>
</html>
