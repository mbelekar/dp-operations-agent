<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidence grounding: tool call to validated diagnosis</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 480px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Evidence grounding</p>
    <h1>How a diagnosis stays grounded</h1>

    <svg viewBox="0 0 440 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grounding-title grounding-desc">
      <title id="grounding-title">Evidence grounding for a diagnosis</title>
      <desc id="grounding-desc">Each diagnostic tool call produces a typed Signal with an ID that goes into the session's evidence registry; when the model calls submit_diagnosis, Pydantic validation accepts signal IDs from that registry and rejects any it doesn't contain.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first, so boxes sit on top. Endpoints share x=220: straight lines. -->
      <line x1="220" y1="80" x2="220" y2="119" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="220" y1="176" x2="220" y2="215" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="220" y1="272" x2="220" y2="311" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="220" y1="368" x2="220" y2="407" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="220" y1="464" x2="220" y2="503" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 1 -->
      <rect x="40" y="24" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="24" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diagnostic tool call</text>

      <!-- 2 -->
      <rect x="40" y="120" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Typed Signal with an ID</text>

      <!-- 3 -->
      <rect x="40" y="216" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="216" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session evidence registry</text>

      <!-- 4: a function name, so mono -->
      <rect x="40" y="312" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="312" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="344" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">submit_diagnosis</text>

      <!-- 5: where unknown IDs are rejected (focal) -->
      <rect x="40" y="408" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="408" width="360" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pydantic validation</text>

      <!-- 6 -->
      <rect x="40" y="504" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="504" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accept known signal IDs / reject unknown signal IDs</text>
    </svg>
  </div>
</body>
</html>
