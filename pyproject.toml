[project]
name = "dp-ops-agent"
version = "0.1.0"
description = "Data Platform Operations Agent: diagnoses failures across Kafka, Flink, and dbt"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2,<2",
    "langgraph>=1.2.11,<2",
    "langchain-anthropic>=1.7.2,<2",
    "langsmith>=0.13.0,<1",
    "confluent-kafka>=2.15.1,<3",
    "pydantic>=2.13.5,<3",
    "httpx>=0.28.1,<1",
    "typer>=0.27.2,<1",
    "python-dotenv>=1.2.3,<2",
]

# Installed by default with `uv sync`; `uv sync --no-dev` leaves them out.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "freezegun>=1.5.5,<2",
    "ruff>=0.16.9,<1",
    "mypy>=2.3.1,<3",
    "pytest-cov>=7.1.0,<8",
    "pip-audit>=2.10.1,<3",
]

[project.scripts]
dp-ops-agent = "dp_ops_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_ops_agent"]

[tool.pytest.ini_options]
markers = ["llm: requires a live ANTHROPIC_API_KEY and makes real model calls"]
testpaths = ["tests"]
asyncio_mode = "auto"
# tmp_path directories land in tests/tmp/ (gitignored). pytest wipes this
# directory at the start of every run, so never put anything else in it.
addopts = "-m 'not llm' --basetemp=tests/tmp"
# Offline tests drive the agent with a scripted (non-Anthropic) chat model,
# which the prompt-caching middleware warns about on every call. Filtered
# here, not in session.py, so a real non-Anthropic model still warns.
filterwarnings = [
    "ignore:AnthropicPromptCachingMiddleware caching middleware only supports Anthropic models:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
# Line length is the formatter's job; long strings it can't split stay as-is.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as call defaults; that's its idiom, not a bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# confluent-kafka ships no type stubs.
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

# Used by `pytest --cov` (CI). Not in pytest's addopts, so a subset run
# like `./auto/test -k foo` doesn't fail the threshold.
[tool.coverage.run]
source = ["dp_ops_agent"]
branch = false

[tool.coverage.report]
# Current coverage rounded down: a floor against regressions, not a target.
fail_under = 90
show_missing = true
skip_covered = true

[tool.pydantic-mypy]
# Type-check pydantic model constructor arguments. Without this the plugin
# types every __init__ argument as Any, so a wrong value type, or a plain str
# where a Literal is expected, is only caught at runtime.
init_typed = true
