[project]
name = "dp-ops-agent"
version = "0.1.0"
description = "Data Platform Operations Agent: diagnoses failures across Kafka, Flink, and dbt"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.2,<2",
    "langgraph>=1.2.11,<2",
    "langchain-anthropic>=1.7.2,<2",
    "langsmith>=0.13.0,<1",
    "confluent-kafka>=2.15.1,<3",
    "pydantic>=2.13.5,<3",
    "httpx>=0.28.1,<1",
    "typer>=0.27.2,<1",
    "python-dotenv>=1.2.3,<2",
]

# Installed by default with `uv sync`; `uv sync --no-dev` leaves them out.
[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "freezegun>=1.5.5,<2",
]

[project.scripts]
dp-ops-agent = "dp_ops_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_ops_agent"]

[tool.pytest.ini_options]
markers = ["llm: requires a live ANTHROPIC_API_KEY and makes real model calls"]
testpaths = ["tests"]
asyncio_mode = "auto"
# tmp_path directories land in tests/tmp/ (gitignored). pytest wipes this
# directory at the start of every run, so never put anything else in it.
addopts = "-m 'not llm' --basetemp=tests/tmp"
# Offline tests drive the agent with a scripted (non-Anthropic) chat model,
# which the prompt-caching middleware warns about on every call. Filtered
# here, not in session.py, so a real non-Anthropic model still warns.
filterwarnings = [
    "ignore:AnthropicPromptCachingMiddleware caching middleware only supports Anthropic models:UserWarning",
]
