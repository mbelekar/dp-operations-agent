[project]
name = "dp-ops-agent"
version = "0.1.0"
description = "Data Platform Operations Agent — diagnoses failures across Kafka, Flink, dbt, and data-quality layers"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-anthropic",
    "confluent-kafka",
    "pydantic>=2",
    "httpx",
    "typer",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "freezegun"]

[project.scripts]
dp-ops-agent = "dp_ops_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_ops_agent"]

[tool.pytest.ini_options]
markers = ["llm: requires a live ANTHROPIC_API_KEY and makes real model calls"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not llm'"
